[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "aiidalab_widgets_base/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["aiidalab_widgets_base"]

[project]
name = "aiidalab-widgets-base"
dynamic = ['version']
authors = [{name = 'The AiiDAlab team', email = 'aiidalab@materialcloud.org'}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AiiDA",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "PyCifRW~=4.4",
    "aiida-core>=2.7,<3",
    "ansi2html~=1.7",
    "ase~=3.18",
    "humanfriendly~=10.0",
    "ipytree~=0.2",
    "traitlets~=5.4",
    "ipywidgets~=8.1",
    "pymysql~=0.9",
    "nglview>=3.0.8,<5",
    "spglib~=2.0",
    "vapory~=0.1.2",
    "ipython>=7.33,<9.0",
    "pip>=25",
]

description = "Reusable widgets for AiiDAlab applications."
license = {file = 'LICENSE.txt'}
readme = 'README.md'
requires-python = '>=3.9'

[project.optional-dependencies]
dev = [
    "bumpver>=2023.1129",
    "pre-commit>=4.0",
    "ty==0.0.69",
    "pytest~=8.3.0",
    "pytest-cov~=5.0",
    "pytest-docker~=3.1.0",
    "pytest-selenium~=4.1.0",
    "pytest-timeout~=2.3.0",
    "selenium~=4.23.0",
]
optimade = ["ipyoptimade>=1.2.1,<2"]
smiles = ["rdkit>=2021.09.2"]
docs = [
    "sphinx~=7.3",
    "sphinx-design~=0.5",
    "pydata-sphinx-theme~=0.15",
    "myst-nb~=1.1",
]

[tool.bumpver]
current_version = "v3.0.0a3"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"aiidalab_widgets_base/__init__.py" = ["__version__ = \"{pep440_version}\""]


[tool.pytest.ini_options]
filterwarnings = [
    # We can remove this once aiida-core drops dependency on pytz
    # https://github.com/aiidateam/aiida-core/issues/7544
    "ignore:datetime.datetime.:DeprecationWarning:pytz",
    # This one is coming from plumpy
    "ignore:There is no current event loop:DeprecationWarning:",
    # This is needed since SQLAlchemy 2.0, see
    # https://github.com/aiidalab/aiidalab-widgets-base/issues/605
    'ignore:Object of type.*not in session,.*operation along.*will not proceed:sqlalchemy.exc.SAWarning',
    'ignore:Creating AiiDA configuration:UserWarning:aiida',
    "ignore:crystal system 'cubic' is not interpreted for space group:UserWarning:ase.io.cif",
    # This popped up in spglib 2.5. Since we still try to support spglib v1,
    # it's not clear if we can get rid of it.
    "ignore:dict interface is deprecated. Use attribute interface instead:DeprecationWarning:spglib|aiidalab_widgets_base",
    "ignore:Set OLD_ERROR_HANDLING to false and catch the errors directly:DeprecationWarning:spglib",
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5:DeprecationWarning:ase"
]

[tool.ruff]
line-length = 88
show-fixes = true
target-version = "py39"

[tool.ruff.lint]
ignore = ["RUF012"]

# Temporarily disable ty type checking on these files
[[tool.ty.overrides]]
include = [
  "aiidalab_widgets_base/viewers.py",
  "aiidalab_widgets_base/structures.py",
]

[tool.ty.overrides.rules]
not-subscriptable = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
